name: Customli POS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Type-check and build universal Customli app
        run: npm run build

  android-debug-apk:
    runs-on: ubuntu-latest
    needs: web-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build universal web assets
        run: npm run build
      - name: Prepare universal Android project
        env:
          CUSTOMLI_CLEAN_ANDROID: "1"
        run: npm run android:prepare
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload universal Customli Android APK
        uses: actions/upload-artifact@v4
        with:
          name: customli-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
