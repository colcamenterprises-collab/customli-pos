name: Repair bootstrap once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-bootstrap-once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix bootstrap recipe
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/bootstrap-customli-pos.yml')
          s = p.read_text()
          s = s.replace('"react-dom": "^18.3.1"\n', '"react-dom": "^18.3.1",\n              "lucide-react": "^0.453.0"\n', 1)
          s = s.replace('"lib": ["ES2022", "DOM", "DOM.Iterable"],\n', '"lib": ["ES2022", "DOM", "DOM.Iterable"],\n              "types": ["vite/client"],\n', 1)
          s = s.replace('const globalWindow = window as Window & Record<string, unknown>;', 'const globalWindow = window as unknown as Window & Record<string, unknown>;', 1)
          needle = "              ('window.location.assign(\"/pos?lock=1\")', 'window.location.assign(\"/register?lock=1\")'),\n"
          insert = needle + "              ('window as Window & Record<string, unknown>', 'window as unknown as Window & Record<string, unknown>'),\n"
          if insert not in s:
              s = s.replace(needle, insert, 1)
          p.write_text(s)
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/bootstrap-customli-pos.yml
          git commit -m "Fix Customli POS bootstrap build prerequisites"
          git push origin HEAD:main
