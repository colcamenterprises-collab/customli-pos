name: Bootstrap Customli POS v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-customli-pos-v2.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Customli POS
        uses: actions/checkout@v4
        with:
          path: target
          fetch-depth: 0

      - name: Checkout proven POS source snapshot
        uses: actions/checkout@v4
        with:
          repository: colcamenterprises-collab/final-dashboard-4
          ref: 4a6cf40e86fe6eb0353d3eed986d3523c9845083
          path: source
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract operational application
        shell: bash
        run: |
          set -euo pipefail
          cd target
          mkdir -p src/pages src/lib src/config public native/android reference/backend/routes reference/backend/services/ordering docs

          cp ../source/client/src/pages/pos/PosRegister.tsx src/pages/PosRegister.tsx
          cp ../source/client/src/pages/pos/PosRegisterGate.tsx src/pages/PosRegisterGate.tsx
          cp ../source/client/src/pages/pos/PosKitchen.tsx src/pages/PosKitchen.tsx
          cp ../source/client/src/pages/pos/PosDisplay.tsx src/pages/PosDisplay.tsx
          cp ../source/client/src/pages/pos/PosShifts.tsx src/pages/PosShifts.tsx
          cp ../source/client/src/pages/pos/PrinterSettings.tsx src/pages/PrinterSettings.tsx
          cp ../source/client/src/lib/thermalPrinter.ts src/lib/thermalPrinter.ts
          cp ../source/client/src/lib/posPrinterSettings.ts src/lib/posPrinterSettings.ts
          cp ../source/client/src/lib/posNativeCheckoutBridge.ts src/lib/posNativeCheckoutBridge.ts
          cp ../source/native/android/MainActivity.java native/android/MainActivity.java
          cp ../source/native/android/ThermalPrinterPlugin.java native/android/ThermalPrinterPlugin.java

          cp ../source/server/routes/pos.ts reference/backend/routes/pos.ts
          cp ../source/server/routes/posShifts.ts reference/backend/routes/posShifts.ts
          cp ../source/server/routes/ordering.ts reference/backend/routes/ordering.ts
          cp ../source/server/services/ordering/orderingService.ts reference/backend/services/ordering/orderingService.ts
          cp ../source/server/services/ordering/posOrderBridge.ts reference/backend/services/ordering/posOrderBridge.ts

          if [ -f ../source/client/public/burger-placeholder.png ]; then cp ../source/client/public/burger-placeholder.png public/burger-placeholder.png; fi

          cat > package.json <<'EOF'
          {
            "name": "@customli/pos",
            "version": "0.1.0",
            "private": true,
            "type": "module",
            "scripts": {
              "dev": "vite --host 0.0.0.0",
              "build": "tsc --noEmit && vite build",
              "preview": "vite preview --host 0.0.0.0",
              "android:add": "npx cap add android",
              "android:sync": "npx cap sync android"
            },
            "dependencies": {
              "@capacitor/core": "^7.4.3",
              "lucide-react": "^0.453.0",
              "react": "^18.3.1",
              "react-dom": "^18.3.1"
            },
            "devDependencies": {
              "@capacitor/android": "^7.4.3",
              "@capacitor/cli": "^7.4.3",
              "@types/react": "^18.3.11",
              "@types/react-dom": "^18.3.1",
              "@vitejs/plugin-react": "^4.3.2",
              "autoprefixer": "^10.4.20",
              "postcss": "^8.4.47",
              "tailwindcss": "^3.4.17",
              "typescript": "^5.9.2",
              "vite": "^5.4.19"
            }
          }
          EOF

          cat > tsconfig.json <<'EOF'
          {
            "compilerOptions": {
              "target": "ES2022",
              "useDefineForClassFields": true,
              "lib": ["ES2022", "DOM", "DOM.Iterable"],
              "types": ["vite/client"],
              "skipLibCheck": true,
              "esModuleInterop": true,
              "allowSyntheticDefaultImports": true,
              "strict": true,
              "module": "ESNext",
              "moduleResolution": "Bundler",
              "resolveJsonModule": true,
              "isolatedModules": true,
              "noEmit": true,
              "jsx": "react-jsx",
              "baseUrl": ".",
              "paths": { "@/*": ["src/*"] }
            },
            "include": ["src"]
          }
          EOF

          cat > vite.config.ts <<'EOF'
          import { defineConfig, loadEnv } from "vite";
          import react from "@vitejs/plugin-react";
          import path from "node:path";
          export default defineConfig(({ mode }) => {
            const env = loadEnv(mode, process.cwd(), "");
            const target = env.VITE_DEV_API_TARGET || "";
            return {
              plugins: [react()],
              resolve: { alias: { "@": path.resolve(__dirname, "src") } },
              server: target ? { proxy: { "/api": { target, changeOrigin: true, secure: true } } } : undefined,
              build: { outDir: "dist" },
            };
          });
          EOF

          cat > tailwind.config.cjs <<'EOF'
          module.exports = { content: ["./index.html", "./src/**/*.{js,ts,jsx,tsx}"], theme: { extend: {} }, plugins: [] };
          EOF
          cat > postcss.config.cjs <<'EOF'
          module.exports = { plugins: { tailwindcss: {}, autoprefixer: {} } };
          EOF

          cat > index.html <<'EOF'
          <!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><meta name="theme-color" content="#111111"/><title>Customli POS</title></head><body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body></html>
          EOF

          cat > src/styles.css <<'EOF'
          @tailwind base;
          @tailwind components;
          @tailwind utilities;
          :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#171717;background:#fff}*{box-sizing:border-box}body{margin:0;min-width:320px;min-height:100vh}button,input,select,textarea{font:inherit}
          EOF

          cat > src/config/product.ts <<'EOF'
          export type DeviceRole = "register" | "kitchen" | "display";
          export const PRODUCT = { owner: "Customli.io", name: "Customli POS", appId: "io.customli.pos", storagePrefix: "customli.pos" } as const;
          export const REFERENCE_TENANT = { id: "sbb", name: "Smash Brothers Burgers", status: "customer-1-reference" } as const;
          export const DEVICE_ROLE_KEY = `${PRODUCT.storagePrefix}.deviceRole`;
          EOF

          cat > src/lib/apiBase.ts <<'EOF'
          const API_BASE = String(import.meta.env.VITE_CUSTOMLI_API_BASE || "").replace(/\/$/, "");
          const FLAG = "__customliApiBaseInstalled";
          export function installApiBase() {
            const globalWindow = window as unknown as Window & Record<string, unknown>;
            if (!API_BASE || globalWindow[FLAG]) return;
            globalWindow[FLAG] = true;
            const originalFetch = window.fetch.bind(window);
            window.fetch = ((input: RequestInfo | URL, init?: RequestInit) => {
              if (typeof input === "string" && input.startsWith("/api/")) return originalFetch(`${API_BASE}${input}`, { ...init, credentials: init?.credentials || "include" });
              if (input instanceof URL && input.pathname.startsWith("/api/") && input.origin === window.location.origin) return originalFetch(new URL(`${input.pathname}${input.search}`, API_BASE), { ...init, credentials: init?.credentials || "include" });
              return originalFetch(input, init);
            }) as typeof window.fetch;
          }
          EOF

          cat > src/App.tsx <<'EOF'
          import { useEffect, useState } from "react";
          import PosRegisterGate from "@/pages/PosRegisterGate";
          import PosKitchen from "@/pages/PosKitchen";
          import PosDisplay from "@/pages/PosDisplay";
          import PosShifts from "@/pages/PosShifts";
          import PrinterSettings from "@/pages/PrinterSettings";
          import { DEVICE_ROLE_KEY, PRODUCT, type DeviceRole } from "@/config/product";
          function navigate(path:string){window.history.pushState({},"",path);window.dispatchEvent(new PopStateEvent("popstate"));}
          function DeviceSetup(){const choose=(role:DeviceRole)=>{localStorage.setItem(DEVICE_ROLE_KEY,role);navigate(role==="register"?"/register":role==="kitchen"?"/kitchen":"/display");};return <main className="grid min-h-dvh place-items-center bg-zinc-950 p-6 text-white"><section className="w-full max-w-2xl rounded-3xl bg-white p-8 text-zinc-950 shadow-2xl"><p className="text-xs font-black uppercase tracking-[.25em] text-amber-500">{PRODUCT.owner}</p><h1 className="mt-2 text-4xl font-black">Set up this device</h1><p className="mt-3 text-zinc-600">Choose what this device does. You can change it later without reinstalling.</p><div className="mt-7 grid gap-3 sm:grid-cols-3"><button onClick={()=>choose("register")} className="rounded-2xl bg-amber-400 p-5 text-left font-black">POS Register<span className="mt-2 block text-sm font-medium">Take orders, payments and print tickets.</span></button><button onClick={()=>choose("kitchen")} className="rounded-2xl bg-zinc-900 p-5 text-left font-black text-white">Kitchen Display<span className="mt-2 block text-sm font-medium text-zinc-300">Prepare and hand off live orders.</span></button><button onClick={()=>choose("display")} className="rounded-2xl bg-zinc-100 p-5 text-left font-black">Customer Display<span className="mt-2 block text-sm font-medium">Show ready ticket numbers.</span></button></div><p className="mt-7 text-sm text-zinc-500">Setup is designed for business owners and staff, not developers.</p></section></main>}
          export default function App(){const[path,setPath]=useState(window.location.pathname);useEffect(()=>{const update=()=>setPath(window.location.pathname);window.addEventListener("popstate",update);return()=>window.removeEventListener("popstate",update)},[]);if(path==="/register")return <PosRegisterGate/>;if(path==="/kitchen")return <PosKitchen/>;if(path==="/display")return <PosDisplay/>;if(path==="/shifts")return <PosShifts/>;if(path==="/printer")return <PrinterSettings/>;return <DeviceSetup/>}
          EOF

          cat > src/main.tsx <<'EOF'
          import { StrictMode } from "react";
          import { createRoot } from "react-dom/client";
          import App from "./App";
          import "./styles.css";
          import { installApiBase } from "@/lib/apiBase";
          import { installPosNativeCheckoutBridge } from "@/lib/posNativeCheckoutBridge";
          installApiBase();
          installPosNativeCheckoutBridge();
          const root=document.getElementById("root");if(!root)throw new Error("Root element not found");createRoot(root).render(<StrictMode><App/></StrictMode>);
          EOF

          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from "@capacitor/cli";
          const config: CapacitorConfig = { appId: "io.customli.pos", appName: "Customli POS", webDir: "dist", android: { allowMixedContent: false } };
          export default config;
          EOF

          cat > public/customli-mark.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"><rect width="128" height="128" rx="28" fill="#111"/><path d="M92 41c-7-9-17-14-29-14-21 0-38 16-38 37s17 37 38 37c12 0 23-5 30-14L79 76c-4 5-9 7-16 7-11 0-20-8-20-19s9-19 20-19c6 0 12 3 16 8l13-12Z" fill="#facc15"/></svg>
          EOF

          python3 - <<'PY'
          from pathlib import Path
          files=list(Path('src/pages').glob('*.tsx'))+list(Path('src/lib').glob('*.ts'))
          replacements=[
            ('/smash-brothers-logo.png','/customli-mark.svg'),('Smash Brothers Burgers','Customli POS'),('SMASH BROTHERS','CUSTOMLI POS'),('SBB POS','CUSTOMLI POS'),
            ('sbb_kitchen_sound','customli_kitchen_sound'),('sbb_display_seen_ready','customli_display_seen_ready'),('sbb.nativePrinter.address','customli.nativePrinter.address'),('sbb.pos.lastNativeCheckoutStatus','customli.pos.lastNativeCheckoutStatus'),('sbb_pos_printer_settings','customli_pos_printer_settings'),
            ('href="/pos/kitchen"','href="/kitchen"'),('href="/pos/display"','href="/display"'),('href="/pos/shifts"','href="/shifts"'),('href="/pos"','href="/register"'),('href="/dashboard"','href="/"'),('window.location.assign("/pos?lock=1")','window.location.assign("/register?lock=1")'),
            ('window as Window & Record<string, unknown>','window as unknown as Window & Record<string, unknown>')]
          for path in files:
            text=path.read_text()
            for old,new in replacements:text=text.replace(old,new)
            path.write_text(text)
          for path in [Path('native/android/MainActivity.java'),Path('native/android/ThermalPrinterPlugin.java')]:path.write_text(path.read_text().replace('io.customli.sbbpos','io.customli.pos'))
          PY

          cat > docs/PRODUCT_PRINCIPLES.md <<'EOF'
          # Customli POS product principles
          Customli.io owns and develops Customli POS. Smash Brothers Burgers is Customer #1 and the reference tenant, not the product identity.

          The primary user is a small-business or medium-enterprise owner who is not expected to be technical.

          1. Plain language before technical language.
          2. Sensible defaults before configuration screens.
          3. Guided setup before documentation.
          4. One obvious operational action wherever possible.
          5. Back Office holds complexity; frontline screens stay fast and focused.
          6. Business capabilities are configurable, never hard-coded to one customer.
          7. Device roles are Register, Kitchen Display and Customer Display.
          8. Hardware failures explain what the owner can do next.
          9. Routine menu, staff, printer, tax, payment and reporting changes must not require a developer.
          10. SBB-specific behavior is reference configuration, not a platform assumption.
          EOF

          cat > docs/API_AND_DATA_BOUNDARY.md <<'EOF'
          # API and data boundary
          Phase 1 preserves the proven production API contracts instead of rewriting the backend during client extraction.

          Copied route and service implementations under `reference/backend/` are dependency snapshots, not compiled client code.

          Operational API families:
          - `/api/pos/*` — register menu, modifiers, orders, receipt truth, display, discounts and order status.
          - `/api/pos-shifts/*` — current/open/close shift and cash movements.
          - `/api/ordering/*` — shared kitchen queue and non-register order lifecycle.

          No live customer records, order history, credentials, database secrets or PII are copied into this public repository. Production data stays in the existing system of record until a separately approved backend migration.

          `VITE_CUSTOMLI_API_BASE` targets a compatible backend. Cross-origin authenticated operation must be proven before cutover. `VITE_DEV_API_TARGET` provides a development proxy.
          EOF

          cat > docs/SOURCE_SNAPSHOT.md <<'EOF'
          # Extraction source snapshot
          Source: `colcamenterprises-collab/final-dashboard-4`
          Pinned commit: `4a6cf40e86fe6eb0353d3eed986d3523c9845083`

          Extracted: Register, shift gate, Kitchen Display, Customer Display, shifts, printer settings, native Bluetooth/ESC-POS/TTS, checkout hardware bridge, and reference POS/shift/ordering backend routes and services.
          EOF

          cat > .env.example <<'EOF'
          VITE_CUSTOMLI_API_BASE=
          VITE_DEV_API_TARGET=
          EOF
          cat > .gitignore <<'EOF'
          node_modules/
          dist/
          android/
          .env
          .env.*
          !.env.example
          *.log
          .DS_Store
          EOF

      - name: Install and validate standalone web build
        working-directory: target
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Commit extracted foundation
        working-directory: target
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Establish Customli POS standalone foundation"
          git push origin HEAD:main
